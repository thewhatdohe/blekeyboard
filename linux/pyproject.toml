[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blekeyboard"
version = "0.1.0"
authors = [
  { name="thewhatdohe" },
]
description = "A Python package that drives a local Bluetooth controller over a raw HCI user channel to advertise as a BLE peripheral, working toward HID keyboard emulation. Inspired by the ESP32 library (bleKeyboard)."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://github.com/thewhatdohe/blekeyboard"
